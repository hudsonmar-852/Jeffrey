<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-version" content="5.1.0" />
  <meta name="last-updated" content="2026-08-09" />
  <title>Jeffrey 每日短訊精選</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="reminder/relationship.css" />
  <link rel="stylesheet" href="reminder/curator-overrides.css?v=5.1.0" />
</head>
<body>
  <div class="curator-shell">
    <header class="curator-hero">
      <nav class="root-links" aria-label="Jeffrey tools">
        <a href="clients.html">Clients</a>
        <a href="gym/">Gym</a>
        <a href="bible.html">Bible</a>
      </nav>
      <div class="eyebrow">Jeffrey Daily Curator</div>
      <div class="board-facts board-summary" aria-label="今日精選資料">
        <span>今日 <strong id="boardDate">—</strong></span>
        <span>更新 <strong id="updatedDate">—</strong></span>
        <span>累積使用 <strong id="usageTotal">0</strong> 次</span>
        <span>畫面顯示 <strong>5</strong></span>
      </div>
    </header>
    <main>
      <section aria-labelledby="boardTitle">
        <div class="section-heading">
          <div>
            <div class="eyebrow">Daily curated board</div>
            <h2 id="boardTitle">揀一條，傳一個真心提醒</h2>
          </div>
          <p>揀好就可以直接複製。</p>
        </div>
        <nav class="curator-tabs" aria-label="短訊檢視">
          <button class="curator-tab active" type="button" data-view="today">
            今日精選 <span id="todayCount" class="view-count">0</span>
          </button>
          <button class="curator-tab" type="button" data-view="favourites">
            ★ 收藏庫 <span id="favouriteCount" class="view-count">0</span>
          </button>
        </nav>
        <div id="messageGrid" class="curator-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          今日精選未準備好。畫面唔會顯示舊短訊，請稍後再試。
        </div>
      </section>
    </main>
    <footer>Curator Engine v2 · Top 5 only · Human controlled</footer>
  </div>
  <script type="module" src="reminder/app.js?v=5.1.0"></script>
</body>
</html>
