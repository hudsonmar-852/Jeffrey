<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-version" content="5.0.0" />
  <meta name="last-updated" content="2026-07-28" />
  <title>Jeffrey 每日短訊精選</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="relationship.css" />
  <link rel="stylesheet" href="curator-overrides.css" />
</head>
<body>
  <div class="curator-shell">
    <header class="curator-hero">
      <a href="../" class="back-link">← Jeffrey Platform</a>
      <div class="eyebrow">Jeffrey Daily Curator</div>
      <h1>今日五選一</h1>
      <p>每日只留低五條最值得傳嘅短訊，由 Jeffrey 揀一條。</p>
      <div class="board-facts" aria-label="今日精選資料">
        <span>日期 <strong id="boardDate">—</strong></span>
        <span>畫面顯示 <strong>5</strong></span>
      </div>
    </header>

    <main>
      <section aria-labelledby="boardTitle">
        <div class="section-heading">
          <div>
            <div class="eyebrow">Daily curated board</div>
            <h2 id="boardTitle">揀一條，傳一個真心提醒</h2>
          </div>
          <p>揀好就可以直接複製。</p>
        </div>
        <div id="messageGrid" class="curator-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          今日精選未準備好。畫面唔會顯示舊短訊，請稍後再試。
        </div>
      </section>
    </main>

    <footer>Curator Engine v2 · Top 5 only · Human controlled</footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
